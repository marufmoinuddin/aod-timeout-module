name: AOD Module Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-apk:
    name: Verify APK Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Android SDK
      uses: actions/cache@v3
      with:
        path: ~/.android-sdk
        key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.sh') }}
        restore-keys: |
          ${{ runner.os }}-android-sdk-
          
    - name: Install Android SDK
      run: |
        mkdir -p $HOME/.android-sdk
        echo "ANDROID_HOME=$HOME/.android-sdk" >> $GITHUB_ENV
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $HOME/.android-sdk/tmp
        mv $HOME/.android-sdk/tmp/cmdline-tools $HOME/.android-sdk/cmdline-tools
        yes | $HOME/.android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        
    - name: Build APK
      run: |
        chmod +x build.sh
        ./build.sh
        
    - name: Verify APK Structure
      run: |
        echo "=== APK Contents ==="
        unzip -l dist/aod_timeout_module_v1.1_debug.apk
        
        echo ""
        echo "=== DEX Size ==="
        unzip -p dist/aod_timeout_module_v1.1_debug.apk classes.dex | wc -c
        
        echo ""
        echo "=== Manifest Check ==="
        $HOME/.android-sdk/cmdline-tools/latest/bin-sdk/build-tools/34.0.0/aapt dump badging dist/aod_timeout_module_v1.1_debug.apk 2>/dev/null | grep -E "(package:|application:|uses-sdk:)" || echo "aapt check skipped"
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aod-debug-apk
        path: dist/aod_timeout_module_v1.1_debug.apk
        
  test-redroid:
    name: Test on Redroid
    runs-on: ubuntu-latest
    needs: verify-apk
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: aod-debug-apk
        path: dist/
        
    - name: Start Redroid Container
      run: |
        docker run -d --name redroid --privileged -p 5555:5555 redroid/redroid:13.0.0
        
    - name: Wait for Boot
      run: |
        for i in {1..24}; do
          if docker exec redroid getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
            echo "Android booted!"
            break
          fi
          sleep 5
        done
        
    - name: Install and Test
      run: |
        apt-get update && apt-get install -y android-sdk-platform-tools
        adb connect localhost:5555
        adb install -r dist/aod_timeout_module_v1.1_debug.apk
        adb shell am start -n com.ambient.aodtimeout/com.ambient.aodtimeout.MainActivity
        sleep 5
        adb logcat -d > test-logs.txt || true
        
    - name: Check for Crashes
      run: |
        if grep -q "FATAL EXCEPTION" test-logs.txt 2>/dev/null; then
          echo "❌ CRASH DETECTED"
          grep -A 20 "FATAL EXCEPTION" test-logs.txt
          exit 1
        else
          echo "✅ No fatal crashes detected"
        fi
        
    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: test-logs.txt
        
  validate-module:
    name: Validate Module Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check Module Files
      run: |
        echo "=== Checking Module Structure ==="
        
        # Check source files
        find app/src/main/java -name "*.java" | wc -l | xargs echo "Java source files:"
        
        # Check compiled classes
        if [ -d "build/classes" ]; then
            find build/classes -name "*.class" | wc -l | xargs echo "Compiled classes:"
        else
            echo "⚠️ Build classes not found (run build first)"
        fi
        
        # Check ZIP contents
        if [ -f "dist/aod_timeout_module_v1.1_production.zip" ]; then
            unzip -l dist/aod_timeout_module_v1.1_production.zip | head -20
        fi
        
    - name: Verify Xposed Hook
      run: |
        echo "=== Checking Xposed Hook Implementation ==="
        grep -r "IXposedHookLoadPackage" app/src/main/java/ || echo "⚠️ Xposed interface not found"
        grep -r "findAndHookMethod" app/src/main/java/ || echo "⚠️ No method hooks found"
        grep -r "com.android.systemui" app/src/main/java/ || echo "⚠️ SystemUI not targeted"
